<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    
    <button id="btn">Login</button>

    <button id="btns">double click</button>

    <h1 id="heading">This is heading 1</h1>

<br><br>

    <form action="" id="form">
        <label for="">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <button type="submit">Submit</button>

    </form>


    <h1 id="mouseOver">mouse Over event</h1>
    <h2 id="mouseEnter">mouse Enter event</h2>
    <h3 id="mouseOut">mouse Out event</h3>
    <h4 id="mouseUp">mouse up event</h4>
    <h5 id="mouseDown">mouse Down event</h5>
    <h2 id="mouseLeave">mouse Leave event</h2>
    <p id="mouseMove">mouse Move event</p>

    <input type="text" placeholder="key down" id="down">

    <br><br>

    <input type="text" placeholder="key up" id="up">

    <br><br>

    <input type="text" placeholder="key press" id="press">


    <script src="./script.js"></script>
</body>
</html>
